<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Urenbank</title>
  <meta name="description" content="Houd je urenbank, verlofsaldo en verlofplanning bij.">
  <meta name="theme-color" content="#17242e">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Urenbank">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="app"><p class="laden" style="text-align:center">Urenbank laden…</p></div>
  <script type="module" src="js/app.js"></script>
  <script>
    // Laat een melding zien als de app na 15 seconden nog niet geladen is (bijvoorbeeld zonder internet)
    function urenbankLaadfout(tekst) {
      var app = document.getElementById('app');
      if (app && app.querySelector('.laden') && !document.getElementById('inhoud')) {
        app.innerHTML = '<div class="login"><p class="merk">Uren<span>bank</span></p><p id="laadfout"></p>' +
          '<button class="knop" onclick="location.reload()">Opnieuw proberen</button></div>';
        document.getElementById('laadfout').textContent = tekst;
      }
    }
    window.addEventListener('error', function (e) {
      if (e.filename && /\/js\//.test(e.filename)) urenbankLaadfout('De app kon niet starten. Controleer je internet en probeer het opnieuw.');
    });
    window.addEventListener('unhandledrejection', function (e) {
      urenbankLaadfout((e.reason && e.reason.message) || 'De app kon niet starten. Controleer je internet en probeer het opnieuw.');
    });
    setTimeout(function () { urenbankLaadfout('Het laden duurt erg lang. Controleer je internet en probeer het opnieuw.'); }, 15000);
  </script>
</body>
</html>
